name: release
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        run: |
          mkdir -p dist
          zip -r dist/platform-lab-${GITHUB_REF_NAME}.zip src
      - name: Record checksum
        run: sha256sum dist/*.zip | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
      
      - name: Attach package to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
